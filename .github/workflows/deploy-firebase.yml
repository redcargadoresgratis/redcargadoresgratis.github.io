name: Publicar reglas Firebase

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Conectar con Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/732739365133/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-firebase-rules@cargador-castello-de-rugat.iam.gserviceaccount.com

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Publicar reglas de Firestore
        run: firebase deploy --only firestore:rules --project cargador-castello-de-rugat --non-interactive
