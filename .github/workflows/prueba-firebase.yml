name: Prueba conexion Firebase

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Conectar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/732739365133/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-firebase-rules@cargador-castello-de-rugat.iam.gserviceaccount.com
          token_format: access_token

      - name: Confirmar conexion
        run: echo "Conexion con Firebase correcta"
